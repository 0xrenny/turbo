<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TURBO</title><meta name="description" content=""><meta name="theme-color" content="#0b0a08">
<link rel="icon" href="assets/mascot.png"><meta property="og:image" content="assets/mascot.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css"><script src="config.js"></script></head><body>
<div id="stage">
  <svg id="scene" xmlns="http://www.w3.org/2000/svg"><defs>
    <linearGradient id="hg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".35" stop-color="var(--hose)" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></linearGradient>
    <radialGradient id="fg"><stop offset="0" stop-color="#fff"/><stop offset=".3" stop-color="var(--accent)"/><stop offset=".7" stop-color="var(--flame)"/><stop offset="1" stop-color="var(--flame)" stop-opacity="0"/></radialGradient>
  </defs>
    <g id="ruler"></g>
    <path id="hose-shadow"/><path id="hose"/><path id="hose-ribs"/><path id="hose-shine"/>
    <g id="nozzle"><rect x="-10" y="-17" width="22" height="34" rx="4"/><circle id="flame" cx="26" r="22" fill="url(#fg)"/></g>
    <g id="dim"><line id="dimline"/><text id="dimtext" text-anchor="middle"></text></g>
  </svg>
  <img id="frog" data-img alt="">
  <header class="top"><b data-name></b><span class="mono dimc" data-ticker></span><span class="sp"></span>
    <button class="ca mono" id="copy"><span>CA</span> <code data-contract></code></button>
    <a data-link="x" target="_blank" rel="noopener">X</a><a data-link="telegram" target="_blank" rel="noopener">TG</a><a data-link="dex" target="_blank" rel="noopener">Chart</a></header>
  <div class="hud">
    <div><p class="lbl">Market cap <span id="live" class="mono">SIMULATED</span></p><p id="mc" class="big mono">$0</p></div>
    <div><p class="lbl">Length</p><p id="len" class="big mono">0 cm</p></div>
    <div><p class="lbl">Record</p><p id="rec" class="big mono dimc">0 cm</p></div>
  </div>
  <h1 class="title"><span data-name></span><em id="comment"></em></h1>
  <div class="ctrl"><button id="dump" class="mono">DUMP</button><button id="pump" class="mono">PUMP ↑</button></div>
  <p class="hint mono">scroll to assist growth ↓</p>
</div>
<main>
  <section class="s-lore"><p class="lbl">The lore</p><p class="lede" id="lore"></p></section>
  <section><p class="lbl">Measurements</p><div id="facts" class="facts"></div></section>
  <section class="split"><div><p class="lbl">How to buy</p><ol id="buy"></ol></div><div><p class="lbl">Roadmap, by length</p><ul id="rm"></ul></div></section>
  <footer><p class="lede small"><span data-name></span> is a meme. No value, no promises, no fuel. Length is simulated until it isn't.</p><p class="lbl">© <span id="yr"></span></p></footer>
</main>
<div id="toast"></div>
<script src="assets/app.js"></script></body></html>
